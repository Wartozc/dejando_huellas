services:
  - type: web
    name: dejando-huellas-api
    env: go
    buildCommand: go build -o main ./cmd/api/main.go
    startCommand: ./main
    envVars:
      - key: PORT
        value: 8080
      - key: BASE_PATH
        value: "dejando_huellas"
      - key: DATABASE
        value: "dejando_huellas"
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_OWNER
        sync: false
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_BRANCH
        value: "main"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
